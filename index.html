<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B4F9C">
<title>智能金融助手 · 智银银行</title>
<link rel="stylesheet" href="css/style.css?v=20261102g">
</head>
<body>

<!-- 智能体抽屉：能力与记忆 -->
<div class="agent-drawer-overlay" id="agentDrawerOverlay" onclick="toggleAgentDrawer()"></div>
<aside class="agent-drawer" id="agentDrawer">
  <div class="agent-drawer-header">
    <div class="logo">
      <div class="logo-icon">AI</div>
      <div class="logo-copy">
        <div class="logo-title">智能金融助手</div>
        <div class="logo-cap">智银银行 · AI 管家</div>
      </div>
      <span class="badge">AI</span>
    </div>
    <button class="agent-drawer-close" onclick="toggleAgentDrawer()" aria-label="关闭菜单">✕</button>
  </div>

  <button class="drawer-account" onclick="drawerGo(showUserInfoFromTopbar)">
    <span class="drawer-avatar">陈</span>
    <span class="drawer-account-copy">
      <b>小陈</b>
      <small>白金客户 · VIP3</small>
    </span>
    <span class="drawer-account-arrow">›</span>
  </button>

  <div class="agent-drawer-section">
    <div class="nav-title">AI 管家</div>
    <div class="nav-item active" data-module="chat" onclick="switchModule('chat', this)">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z"/></svg></span>
      <span>AI 对话</span>
    </div>
  </div>

  <div class="agent-drawer-section">
    <div class="nav-title">银行服务</div>
    <div class="nav-item" data-module="transfer" onclick="switchModule('transfer', this)">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></span>
      <span>智能转账</span>
    </div>
    <div class="nav-item" data-module="scheduled" onclick="switchModule('scheduled', this)">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg></span>
      <span>定时转账</span>
    </div>
    <div class="nav-item" data-module="bill" onclick="switchModule('bill', this)">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg></span>
      <span>账单分析</span>
    </div>
    <div class="nav-item" data-module="wealth" onclick="switchModule('wealth', this)">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 3 3 7-8"/><path d="M15 7h4v4"/></svg></span>
      <span>理财服务</span>
    </div>
    <div class="nav-item" data-module="card" onclick="switchModule('card', this)">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h3"/></svg></span>
      <span>卡片管理</span>
    </div>
    <div class="nav-item" data-module="subscribe" onclick="switchModule('subscribe', this)">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 19a2 2 0 0 0 3 0"/></svg></span>
      <span>订阅管理</span>
    </div>
  </div>

  <div class="agent-drawer-section">
    <div class="nav-title">AI 记忆</div>
    <div id="agentMemoryBox" class="agent-memory-box"></div>
  </div>

  <div class="drawer-settings">
    <button onclick="drawerGo(showManual)">使用手册</button>
    <button onclick="drawerGo(toggleDarkMode)" id="darkModeBtn">深色模式</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <button class="agent-menu-btn" id="agentMenuBtn" onclick="toggleAgentDrawer()" title="打开菜单" aria-label="打开菜单">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <div class="logo-icon">AI</div>
      <div class="brand-copy">
        <div class="brand-name">智能金融助手</div>
        <div class="brand-sub">智银银行 · AI 管家</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="new-chat-btn" onclick="resetChat()" title="新对话" aria-label="新对话">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z"/></svg>
        <span>新对话</span>
      </button>
      <button class="icon-btn" onclick="showManual()" title="使用手册" aria-label="使用手册">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.7 9.2a2.4 2.4 0 1 1 3.6 2.1c-.8.5-1.3 1-1.3 1.9"/><path d="M12 16.8h.01"/></svg>
      </button>
      <button class="topbar-user-btn" onclick="showUserInfoFromTopbar()" title="账户与交易记录">
        <span class="avatar-sm">陈</span>
        <span class="user-btn-text">小陈</span>
      </button>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="chat-inner" id="chatInner">
    </div>
  </div>

  <!-- 用户信息独立页面 -->
  <div class="userinfo-page" id="userInfoPage">
    <div class="userinfo-header">
      <div class="userinfo-topbar">
        <button class="userinfo-back" onclick="closeUserInfoPage()">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          返回
        </button>
        <button class="userinfo-reset" onclick="resetUserData()">重置数据</button>
      </div>
      <div class="userinfo-profile">
        <div class="userinfo-avatar">陈</div>
        <div style="flex:1;">
          <div class="userinfo-name">小陈 <span class="userinfo-level" id="uiLevel">白金客户（VIP3）</span></div>
          <div class="userinfo-meta" id="uiMeta">尾号 6688 · 开户于 2019-06-18</div>
        </div>
      </div>
    </div>
    <div class="userinfo-tabs">
      <button class="userinfo-tab active" onclick="switchUserInfoTab('overview', this)">账户总览</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('basic', this)">基本信息</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('cards', this)">卡片贷款</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('txns', this)">交易记录</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('contacts', this)">联系人</button>
    </div>
    <div class="userinfo-content" id="userInfoContent"></div>
  </div>

  <div class="input-area">
    <div class="input-inner">
      <div class="input-box">
        <button class="func-btn" id="funcBtn" onclick="toggleFuncPanel()" title="全部服务" aria-label="全部服务">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea class="input-textarea" id="userInput" rows="1"></textarea>
        <div class="voice-recording-bar" id="voiceRecordingBar">
          <div class="voice-wave-mini">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <span class="voice-recording-text" id="voiceRecordingText">正在录音...点击停止</span>
        </div>
        <button class="voice-btn" id="voiceBtn" onclick="toggleGlobalVoice()" title="语音输入" aria-label="语音输入">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
        <button class="clear-chat-btn" id="clearChatBtn" onclick="clearConversation()" title="清除对话并回到主菜单" aria-label="清除对话">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="发送">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 全部服务面板 -->
<div class="func-panel-overlay" id="funcPanelOverlay" onclick="toggleFuncPanel()"></div>
<div class="func-panel" id="funcPanel">
  <div class="func-panel-grabber"></div>
  <div class="func-panel-header">
    <div>
      <div class="func-panel-title">全部服务</div>
      <div class="func-panel-sub">常用银行服务与 AI 能力</div>
    </div>
    <button class="func-panel-close" onclick="toggleFuncPanel()" aria-label="关闭">✕</button>
  </div>
  <div class="func-panel-body" id="funcPanelBody"></div>
</div>


<!-- 模块化JS - 按依赖顺序加载 -->
<script src="js/core/icons.js?v=20261102g"></script>
<!-- 本地密钥（可选）：js/core/config.local.js 已被 git 忽略；缺失时由服务端用环境变量兜底，无 Key 则 AI 能力自动降级 -->
<script src="js/core/config.local.js?v=20261102g"></script>
<script src="js/core/config.js?v=20261102g"></script>
<script src="js/core/api.js?v=20261102g"></script>
<script src="js/core/visualization.js?v=20261102g"></script>
<script src="js/core/storage.js?v=20261102g"></script>
<script src="js/flows/security.js?v=20261102g"></script>
<script src="js/flows/transfer.js?v=20261102g"></script>
<script src="js/flows/wealth.js?v=20261102g"></script>
<script src="js/flows/card.js?v=20261102g"></script>
<script src="js/flows/subscription.js?v=20261102g"></script>
<script src="js/flows/budget.js?v=20261102g"></script>
<script src="js/flows/userinfo.js?v=20261102g"></script>
<script src="js/flows/analysis.js?v=20261102g"></script>
<script src="js/flows/flower.js?v=20261102g"></script>
<script src="js/core/voice.js?v=20261102g"></script>
<script src="js/agent/ai.js?v=20261102g"></script>
<script src="js/core/intent.js?v=20261102g"></script>
<!-- 智能层：记忆 / 工具 / 风险 / 计划 / 洞察与场景 -->
<script src="js/agent/agent.js?v=20261102g"></script>
<!-- v6 认知层：画像分析 / 消费决策 / 风险识别 / 跨场景规划 / 展示增强 -->
<script src="js/agent/profile.js?v=20261102g"></script>
<script src="js/agent/decision.js?v=20261102g"></script>
<script src="js/agent/riskdetect.js?v=20261102g"></script>
<script src="js/agent/planner.js?v=20261102g"></script>
<script src="js/agent/display.js?v=20261102g"></script>
<!-- 信用卡额度与调额层：区分申请/审批/生效额度 + 调额流程 + 纯数学计算 -->
<script src="js/flows/cardlimit.js?v=20261102g"></script>
<!-- 卡片服务：卡片申请 / 交易限制 / 卡片挂失（全部服务 → 卡片分组） -->
<script src="js/flows/cardservice.js?v=20261102g"></script>
<script src="js/agent/agentsvc.js?v=20261102g"></script>
<!-- v7 理解层与知识增强层：指代消解 / 金融知识库(RAG) / 场景推理 -->
<script src="js/agent/context.js?v=20261102g"></script>
<script src="js/agent/kb.js?v=20261102g"></script>
<script src="js/agent/scenario.js?v=20261102g"></script>
<script src="js/agent/insights.js?v=20261102g"></script>
<script src="js/agent/agent-llm.js?v=20261102g"></script>
<script src="js/flows/chat.js?v=20261102g"></script>
<!-- 服务向导：对话起始欢迎语 + 五类服务二级菜单 + 模块内上下文 -->
<!-- 服务向导三层：规则识别（0 模型调用）→ 模型识别（唯一调模型处）→ 流程与渲染 -->
<script src="js/flows/guide-rules.js?v=20261102g"></script>
<script src="js/flows/guide-ai.js?v=20261102g"></script>
<script src="js/flows/guide.js?v=20261102g"></script>
<script src="js/core/ui.js?v=20261102g"></script>
</body>
</html>
