<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B4F9C">
<title>智能金融助手 · 智银银行</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>



<div class="main">
  <div class="topbar">
    <div class="brand">
      <div class="logo-icon">AI</div>
      <div class="brand-copy">
        <div class="brand-name">智能金融助手</div>
        <div class="brand-sub">智银银行 · AI 管家</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="darkModeTopBtn" onclick="toggleDarkMode()" title="深色模式" aria-label="深色模式">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="topbar-user-btn" onclick="showUserInfoFromTopbar()" title="账户与交易记录">
        <span class="avatar-sm">陈</span>
        <span class="user-btn-text">小陈</span>
      </button>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="chat-inner" id="chatInner">
    </div>
  </div>

  <!-- 用户信息独立页面 -->
  <div class="userinfo-page" id="userInfoPage">
    <div class="userinfo-header">
      <div class="userinfo-topbar">
        <button class="userinfo-back" onclick="closeUserInfoPage()">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          返回
        </button>
        <button class="userinfo-reset" onclick="resetUserData()" title="恢复初始演示数据">重置演示数据</button>
      </div>
      <div class="userinfo-profile">
        <div class="userinfo-avatar">陈</div>
        <div style="flex:1;">
          <div class="userinfo-name">小陈 <span class="userinfo-level" id="uiLevel">白金客户（VIP3）</span></div>
          <div class="userinfo-meta" id="uiMeta">尾号 6688 · 开户于 2019-06-18</div>
        </div>
      </div>
    </div>
    <div class="userinfo-tabs">
      <button class="userinfo-tab active" onclick="switchUserInfoTab('overview', this)">账户总览</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('basic', this)">基本信息</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('cards', this)">卡片信息</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('reviews', this)">复核审批</button>
          <button class="userinfo-tab" onclick="switchUserInfoTab('txns', this)">交易记录</button>
      <button class="userinfo-tab" onclick="switchUserInfoTab('contacts', this)">联系人</button>
    </div>
    <div class="userinfo-content" id="userInfoContent"></div>
  </div>

  <div class="input-area">
    <div class="input-inner">
      <div class="input-box">
        <textarea class="input-textarea" id="userInput" rows="1"></textarea>
        <button class="clear-chat-btn" id="clearChatBtn" onclick="clearConversation()" title="清除对话并回到主菜单" aria-label="清除对话">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="发送">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>


<!-- 模块化JS - 按依赖顺序加载 -->
<script src="build/js/core/icons.js"></script>
<!-- 本地密钥（可选）：js/core/config.local.js 已被 git 忽略；缺失时由服务端用环境变量兜底，无 Key 则 AI 能力自动降级 -->
<script src="js/core/config.local.js"></script>
<script src="build/js/core/config.js"></script>
<script src="build/js/core/session.js"></script>
<script src="build/js/core/api.js"></script>
<script src="build/js/core/visualization.js"></script>
<script src="build/js/core/storage.js"></script>
<script src="build/js/flows/security.js"></script>
<script src="build/js/flows/transfer.js"></script>
<script src="build/js/flows/wealth.js"></script>
<script src="build/js/flows/card.js"></script>
<script src="build/js/flows/subscription.js"></script>
<script src="build/js/flows/userinfo.js"></script>
<script src="build/js/flows/analysis.js"></script>
<script src="build/js/agent/ai.js"></script>
<!-- 智能层：记忆 / 工具 / 风险 / 计划 / 洞察与场景 -->
<script src="build/js/agent/agent.js"></script>
<!-- v6 认知层：画像分析 / 消费决策 / 风险识别 / 跨场景规划 / 展示增强 -->
<script src="build/js/agent/profile.js"></script>
<script src="build/js/agent/decision.js"></script>
<script src="build/js/agent/riskdetect.js"></script>
<script src="build/js/agent/planner.js"></script>
<script src="build/js/agent/display.js"></script>
<!-- 信用卡额度与调额层：区分申请/审批/生效额度 + 调额流程 + 纯数学计算 -->
<script src="build/js/flows/cardlimit.js"></script>
<!-- 卡片服务：卡片申请 / 交易限制 / 卡片挂失（全部服务 → 卡片分组） -->
<script src="build/js/flows/cardservice.js"></script>
<script src="build/js/agent/agentsvc.js"></script>
<!-- v7 理解层与知识增强层：指代消解 / 金融知识库(RAG) / 场景推理 -->
<script src="build/js/agent/context.js"></script>
<script src="build/js/agent/kb.js"></script>
<script src="build/js/agent/scenario.js"></script>
<script src="build/js/agent/insights.js"></script>
<script src="build/js/agent/agent-llm.js"></script>
<script src="build/js/flows/chat.js"></script>
<!-- 服务向导：对话起始欢迎语 + 五类服务二级菜单 + 模块内上下文 -->
<!-- 服务向导三层：规则识别（0 模型调用）→ 模型识别（唯一调模型处）→ 流程与渲染 -->
<script src="build/js/flows/guide-rules.js"></script>
<script src="build/js/flows/guide-ai.js"></script>
<script src="build/js/flows/guide-menu.js"></script>
<script src="build/js/flows/guide-transfer.js"></script>
<script src="build/js/flows/guide-wealth.js"></script>
<script src="build/js/flows/guide-sub.js"></script>
<script src="build/js/flows/guide-flower.js"></script>
<script src="build/js/flows/guide-card.js"></script>
<script src="build/js/core/ui.js"></script>
</body>
</html>
